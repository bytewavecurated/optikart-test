# OptikArt client edge: serves the CRA bundle and reverse-proxies everything the
# app expects to find on the same origin (client/src/services/api.js defaults to
# `/api`; stored local-backend image URLs are same-origin `/uploads/...`;
# socket.io connects to window.location.origin). A browser hitting this server
# never needs a cross-origin request, which keeps CORS, cookies and the CSP
# question (deliberately unanswered server-side) all off the table.
#
# The API upstream is the compose service name on the shared network. If you
# deploy the client container somewhere other than beside a server container,
# edit this one line - not the bundle.
upstream optikart_api {
    server server:5000;
}

# The byte ceiling belongs to the application, not the edge: multer caps uploads
# at 10 files x 5MB (middleware/upload.js) and JSON bodies at JSON_BODY_LIMIT.
# This must stay >= that, or nginx 413s what the app would have accepted - the
# edge silently becoming the product limit is exactly the kind of restriction
# "don't limit anything" rules out here. Field-heavy multipart adds a few MB of
# overhead on top of 10 files, hence 64m with room to spare.
client_max_body_size 64m;
client_body_timeout    120s;
proxy_read_timeout     300s;

# Websocket upgrade plumbing: forward `Connection: upgrade` only when the
# request actually asks for it, plain requests keep `Connection: close`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Mirrors middleware/errorSurface.js verbatim (nosniff, DENY, referrer and
    # permissions policy). In this split deployment nginx, not Express, is what
    # serves the HTML document - so the document-level headers have to be set
    # where the document is served or half of the hardening would quietly apply
    # only to API responses. Do not "improve" one copy without the other; the
    # single-container mode (server.js serving ../client/build) must keep
    # matching this block.
    #
    # Strict-Transport-Security is intentionally NOT here: this container serves
    # plain HTTP behind whatever terminates TLS (host nginx, load balancer, CDN)
    # and HSTS is a response the *HTTPS* edge must add. A CSP is intentionally
    # absent everywhere for the documented reason in errorSurface.js: it needs a
    # measured rollout against the live bundle, not to be written blind here.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(self), camera=(), microphone=()" always;

    location /api/ {
        proxy_pass http://optikart_api;
        proxy_http_version 1.1;
        # The only IP these headers arrive under is the one TRUST_PROXY_HOPS=1
        # tells Express to believe; pass the real chain or every rate limit and
        # audit log keys on this container's address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        # Serves locally stored uploads (STORAGE_BACKEND=local / auto fallback).
        # With Cloudinary configured nothing references this path - stored URLs
        # are absolute https - but an air-gapped install needs the same origin.
        proxy_pass http://optikart_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        # socket.io upgrades from polling to websocket (client/src/services/
        # socket.js). Without these two lines the upgrade silently never
        # happens and seller alerts only work on long-poll.
        proxy_pass http://optikart_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        # Content-hashed filenames from the CRA build: safe to cache forever,
        # and a filename change is itself the cache bust. `expires` is used
        # instead of `add_header Cache-Control` because any `add_header` in a
        # location block drops the headers inherited from the server block -
        # the security headers above would silently vanish from these responses.
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1; # index.html must never be cached or a deploy only shows up after a hard-refresh
        # SPA routing: react-router paths resolve client-side, every unknown
        # route must get the bundle, not a 404.
        try_files $uri $uri/ /index.html;
    }
}
