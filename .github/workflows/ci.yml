# CI boots the real server against a real MongoDB, seeds it, and drives the HTTP
# suites in scripts/verify.mjs. That is deliberate: the bugs this codebase
# actually produces are routes that 404, guards that admit the wrong role, and
# edits that never reach the database - none of which a mocked unit test sees.
#
# The client build is not published from CI, only checked. It is ignored by git
# and served from disk, so a workflow could not hand it to any other
# environment even if it wanted to; the value of building it here is that a
# broken import or a JSX error fails the job instead of showing up as a blank
# page. Regenerating the bundle for a deployment stays an explicit, local step.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI always runs in development mode, so the OTP second factor is bypassed
      # and no job needs an SMTP box.
      #
      # SEED_ON_BOOT is gone deliberately. The application no longer loads demo
      # data on boot in ANY environment - the dataset used to delete the eleven
      # collections it owns as its first act, which made a boot that "looks like an
      # empty database" (including a wrong MONGODB_URI) a data-loss event that only
      # NODE_ENV=production was fenced against. scripts/verify.mjs now applies
      # server/fixtures explicitly before starting the API, with
      # --expect-database taken from MONGODB_URI, so this job's data is created by the
      # harness and a mistaken connection is refused instead of wiped.
      NODE_ENV: development
      # Nothing here verifies a token signed elsewhere, so any stable value
      # works - but it must exist, because every login route calls jwt.sign.
      JWT_SECRET: ci-only-secret-not-for-production-use-0123456789
      MONGODB_URI: mongodb://localhost:27017/eyewear-platform
      # The suites use cash on delivery for every order. A CI container has no
      # payment keys, and since the Razorpay clients became lazy nothing needs
      # them to boot.
      VERIFY_PORT: "3111"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build the client (catches broken imports and JSX)
        working-directory: client
        env:
          CI: "false"
        run: npm run build

      - name: Dependency audit gate (runtime trees only)
        # High and critical advisories in what actually SHIPS fail the build;
        # the single accepted LOW (aws-sdk 2.x end-of-support notice) can only
        # be "fixed" by the v3 migration that no CI here can test - it is a
        # tracked next step in RECOMMENDATIONS/SYSTEM notes, not something to
        # blind-migrate every run. Dev-toolchain advisories (CRA's webpack-dev
        # server plumbing) are excluded with --omit=dev because they never
        # reach a browser or this server's request path; when any direct client
        # dependency turns high, the same flag catches it the moment it exists.
        run: |
          cd server && npm audit --omit=dev --audit-level=high
          cd ../client && npm audit --omit=dev --audit-level=high

      - name: Run the API suites
        run: node scripts/verify.mjs

      - name: Report on this run's logs if anything failed
        if: failure()
        run: |
          echo "--- server.log (tail) ---"
          tail -n 60 .verify-logs/server.log 2>/dev/null || echo "no server log"
          echo "--- mongo.log (tail) ---"
          tail -n 20 .verify-logs/mongo.log 2>/dev/null || echo "no mongo log"
  # The Docker story CI never had: build the exact images the release would
  # ship, boot the compose topology (its own mongo - not the job service),
  # and hit the site through the edge. A Dockerfile that cannot install,
  # a compose that cannot start, or an nginx that does not proxy /api would
  # otherwise first be found on the deploy box the day we go live.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    env:
      NODE_ENV: development
      JWT_SECRET: ci-only-secret-not-for-production-use-0123456789
      CLIENT_PORT: "18080"

    steps:
      - uses: actions/checkout@v4

      - name: Build images via compose
        run: docker compose build --pull=missing api client

      - name: Boot stack and wait for the healthcheck
        run: |
          docker compose up -d --wait mongo api
          docker compose up -d client
          sleep 6

      - name: Edge serves the SPA
        run: |
          curl -fsS http://127.0.0.1:18080/ | grep -qi "OptiKart"
          docker compose ps api | tail -1 | grep -i "(healthy)"

      # 42 = socket namespace refused without a token, which is the
      # security posture proven through the real nginx path, not just the
      # direct one.
      - name: nginx routes /api to the service and reports health
        run: |
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/socket.io/?EIO=4&transport=polling' | grep -q 200
          curl -s -X POST -H 'Content-Type: text/plain' --data-binary '40{}' \
            "http://127.0.0.1:18080/socket.io/?EIO=4&transport=polling&sid=$(curl -s 'http://127.0.0.1:18080/socket.io/?EIO=4&transport=polling' | sed 's/^0//' | python3 -c 'import sys,json;print(json.load(sys.stdin)["sid"])')" \
            > /dev/null

      - name: Dumps the container logs if the run fell over
        if: failure()
        run: docker compose logs --tail 80 api client mongo
